<text x="376" y="290.5" font-size="11.5" fill="#93a1b1">GET /api/isLoggedIn</text>
<text x="376" y="308.0" font-size="11.5" fill="#93a1b1"></text>
<text x="376" y="325.5" font-size="11.5" fill="#93a1b1">true  → &lt;Outlet /&gt;</text>
<text x="376" y="343.0" font-size="11.5" fill="#93a1b1">false → 「/」へ Navigate</text>
<text x="376" y="360.5" font-size="11.5" fill="#93a1b1">判定中は Spinner</text>
