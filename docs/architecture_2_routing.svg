<text x="44" y="822" font-size="13" font-weight="700" text-anchor="start" fill="#e8eef5">共通コンポーネント</text>
<text x="44" y="846" font-size="11.5" text-anchor="start" fill="#93a1b1">Layout / Layout2 ・ ProtectedRoute ・ AuthForm ・ CategoryChips ・ RefCard ・ ShoppingCard ・ IngCardCheckboxType ・ CategorySectionHeader ・ Input / Select ・ Message ・ LoadingSpinner</text>
<text x="44" y="870" font-size="11.5" text-anchor="start" fill="#6b7a8c">全画面を NotificationProvider（React Context）で包み、API のエラー・成功メッセージをトースト表示する</text>
