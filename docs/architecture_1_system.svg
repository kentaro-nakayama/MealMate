<text x="342" y="293" font-size="11" fill="#6aa9f4" letter-spacing="0.3">vercel.json</text>
<text x="342" y="317" font-size="11" font-family="'SFMono-Regular','Menlo','Consolas','Liberation Mono',monospace" fill="#93a1b1">/api/(.*)</text>
<text x="342" y="334" font-size="11" font-family="'SFMono-Regular','Menlo','Consolas','Liberation Mono',monospace" fill="#93a1b1">   → backend service</text>
<text x="342" y="351" font-size="11" font-family="'SFMono-Regular','Menlo','Consolas','Liberation Mono',monospace" fill="#93a1b1">/(.*)</text>
<text x="342" y="368" font-size="11" font-family="'SFMono-Regular','Menlo','Consolas','Liberation Mono',monospace" fill="#93a1b1">   → frontend service</text>
