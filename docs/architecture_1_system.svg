<text x="690" y="352" font-size="10.5" font-family="'SFMono-Regular','Menlo','Consolas','Liberation Mono',monospace" text-anchor="start" fill="#6aa9f4">fetch('/api/…',</text>
<text x="690" y="366" font-size="10.5" font-family="'SFMono-Regular','Menlo','Consolas','Liberation Mono',monospace" text-anchor="start" fill="#6aa9f4">  credentials:'include')</text>
<text x="690" y="384" font-size="10" font-family="'SFMono-Regular','Menlo','Consolas','Liberation Mono',monospace" text-anchor="start" fill="#6b7a8c">SameSite=None; Secure</text>
