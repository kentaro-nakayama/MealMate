<text x="616" y="223" font-size="12" fill="#93a1b1">root: frontend/（Vite を自動検出）</text>
<text x="616" y="241" font-size="12" fill="#93a1b1">React + TypeScript + Vite（SPA）</text>
<text x="616" y="259" font-size="12" fill="#93a1b1">react-router-dom でクライアント遷移</text>
<text x="616" y="277" font-size="12" fill="#93a1b1">全パス → index.html にフォールバック</text>
